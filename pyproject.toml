[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pc_csg"
version = "0.1.0"
description = "PC-CSG: Physics-Constrained Counterfactual Scene Graph Transformer for Real-Time Autonomous Anomaly Anticipation"
authors = [
    { name = "Roshan Binoj" },
    { name = "Mohammed Sirajudheen" },
    { name = "Hafiz Feroze Vellukuzhi" },
    { name = "Vishwanath Darur" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
web = [
    "gradio>=4.0.0",
    "matplotlib>=3.7.0",
]
all = [
    "pytest>=7.0.0",
    "gradio>=4.0.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
pc-csg = "pc_csg.cli:main"
pc-csg-demo = "pc_csg.cli:main_demo"
pc-csg-video = "pc_csg.cli:main_video"
pc-csg-bench = "pc_csg.cli:main_bench"
pc-csg-web = "pc_csg.cli:main_web"

[tool.setuptools.packages.find]
where = ["."]
include = ["pc_csg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


